{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Internship Confirmation</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<section class="apply-page">

    <div class="apply-header">
        <h1>Internship Confirmation</h1>
        <p>Confirm and submit your internship selection.</p>
    </div>

    <div class="apply-container">

        <form method="POST">
            {% csrf_token %}

            <!-- Internship Details -->
            <div class="form-group">
                <label>Internship ID</label>
                <input type="text" value="{{ internship.internship_id }}" readonly>
            </div>

            <div class="form-group">
                <label>Internship Course</label>
                <input type="text" value="{{ internship.title }}" readonly>
            </div>

            <hr>

            <!-- Student Details -->
            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ user.username }}" readonly>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" value="{{ profile.full_name }}" readonly>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" value="{{ profile.email }}" readonly>
            </div>

            <br><br>

            <button type="submit" class="submit-btn">
                Confirm & Apply
            </button>

        </form>

    </div>

</section>

</body>
</html>
